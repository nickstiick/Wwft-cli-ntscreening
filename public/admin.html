<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Activatiecode aanmaken</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 20px; }
    h1 { font-size: 1.3rem; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 4px; font-size: 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 20px; padding: 12px 24px; font-size: 1rem; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
    button:hover { background: #1558b0; }
    .result { margin-top: 20px; padding: 16px; background: #e8f5e9; border-radius: 6px; display: none; }
    .result code { font-size: 1.3rem; font-weight: bold; color: #2e7d32; }
    .error { margin-top: 20px; padding: 16px; background: #fce4ec; border-radius: 6px; color: #c62828; display: none; }
  </style>
</head>
<body>
  <h1>Activatiecode aanmaken</h1>

  <label>Admin wachtwoord</label>
  <input type="password" id="secret" placeholder="Je ADMIN_SECRET uit Vercel">

  <label>Aantal credits</label>
  <input type="number" id="credits" value="100" min="1">

  <button id="btn">Code aanmaken</button>

  <div class="result" id="result">
    Je activatiecode: <br><code id="codeOutput"></code>
    <p>Kopieer deze code en vul hem in op de <a href="/screener">screener pagina</a>.</p>
  </div>

  <div class="error" id="error"></div>

  <script>
    document.getElementById('btn').addEventListener('click', async function() {
      const secret = document.getElementById('secret').value.trim();
      const credits = parseInt(document.getElementById('credits').value, 10);
      const resultDiv = document.getElementById('result');
      const errorDiv = document.getElementById('error');

      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';

      if (!secret) { errorDiv.textContent = 'Vul je admin wachtwoord in.'; errorDiv.style.display = 'block'; return; }
      if (!credits || credits < 1) { errorDiv.textContent = 'Vul een geldig aantal credits in.'; errorDiv.style.display = 'block'; return; }

      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + secret
          },
          body: JSON.stringify({ credits: credits })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Er ging iets mis.';
          errorDiv.style.display = 'block';
          return;
        }

        document.getElementById('codeOutput').textContent = data.code;
        resultDiv.style.display = 'block';
      } catch (e) {
        errorDiv.textContent = 'Netwerkfout: ' + e.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
